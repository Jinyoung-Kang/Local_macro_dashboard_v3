spring:
  application:
    name: macro-dashboard-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/macrodash}
    username: ${DATABASE_USER:macro}
    password: ${DATABASE_PASSWORD:macro}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jackson:
    default-property-inclusion: always
    # 날짜는 숫자(타임스탬프)가 아니라 ISO 문자열로. Jackson 3에서는 날짜 기능이 datatype.datetime으로 옮겨졌습니다.
    datatype:
      datetime:
        write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  # JSON 응답 압축. 거시 지표 개요·환율 5년 차트는 한 번에 250KB 안팎이라
  # 휴대폰·와이파이에서 체감 차이가 큽니다. 2KB 미만은 압축 비용이 더 커서 제외.
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2048
  # 오류 응답에 예외 문구를 싣지 않습니다(예전에는 SQL 문장까지 나갔습니다).
  # API 오류 형식은 web/ApiExceptionHandler · config/ErrorResponseConfig가 맞춥니다.
  error:
    include-message: never

dashboard:
  # 화면 접속 비밀번호 (구버전 [auth] password와 같은 역할)
  # 비었거나 옛 공개 기본값(admin1234@)이면 받지 않고 실행마다 임시 비밀번호를 만듭니다(로그에 표시).
  password: ${APP_PASSWORD:}
  # 세션 토큰 서명 키 — 운영에서는 반드시 무작위 값으로 바꾸세요
  jwt-secret: ${JWT_SECRET:change-me-please-change-me-please-32b}
  session-minutes: ${SESSION_MINUTES:720}
  # HTTPS로만 접속할 때 true (세션 쿠키에 Secure). http://에서 켜면 로그인이 안 됩니다.
  cookie-secure: ${COOKIE_SECURE:false}

  # auto | store_only | live_only
  #   auto       저장본이 신선하면 사용, 오래되면 수집기에 수집 요청
  #   store_only 저장본만 사용 (화면이 절대 외부를 기다리지 않음)
  #   live_only  항상 수집 요청 (디버깅용)
  read-mode: ${DASHBOARD_READ_MODE:auto}

  collector-url: ${COLLECTOR_URL:http://localhost:8000}
  collector-token: ${COLLECTOR_API_TOKEN:}
  collector-timeout-seconds: ${COLLECTOR_TIMEOUT_SECONDS:90}

  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  frontend-port: ${FRONTEND_PORT:3000}

  ai:
    nvidia-api-key: ${NVIDIA_API_KEY:}
    cerebras-api-key: ${CEREBRAS_API_KEY:}
    cloudflare-account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    cloudflare-api-token: ${CLOUDFLARE_API_TOKEN:}
    # 추론형 모델(gpt-oss, DeepSeek-R1 등)은 응답까지 몇 분이 걸릴 수 있습니다.
    # 아래 한도는 "엔진을 직접 고른 경우"에 적용됩니다.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:240}
    # '⚡ 자동 탐색'은 되는 엔진을 빨리 찾는 것이 목적이라 한도가 따로입니다.
    #   auto-attempt-seconds  엔진 하나를 기다리는 한도 (넘으면 다음 엔진)
    #   auto-budget-seconds   폴오버 전체에 주는 시간 예산 (넘으면 중단)
    auto-attempt-seconds: ${AI_AUTO_ATTEMPT_SECONDS:60}
    auto-budget-seconds: ${AI_AUTO_BUDGET_SECONDS:180}

logging:
  level:
    root: INFO
    com.macrodash: ${LOG_LEVEL:INFO}
