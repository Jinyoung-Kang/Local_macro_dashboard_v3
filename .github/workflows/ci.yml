name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 작업 토큰은 코드 읽기만. 이 워크플로에는 저장소·패키지에 쓰는 단계가 없습니다(기본 권한에 기대지 않음).
permissions:
  contents: read

jobs:
  collector:
    name: 수집기 (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
          POSTGRES_DB: macrodash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macrodash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            collector/requirements-dev.txt
            collector/constraints.txt

      - name: 의존성 설치
        working-directory: collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      # 로컬에서 쓰는 린터(ruff, requirements-dev.txt에 버전 고정)를 CI에서도 돌립니다.
      - name: 린트 (ruff)
        working-directory: collector
        run: ruff check app tests

      # 알려진 취약점 점검. 실패해도 빌드를 막지 않고 경고로 남깁니다 — 고치는 쪽이 사람이고,
      # 새 공시가 올라올 때마다 모든 PR이 빨개지면 아무도 보지 않게 됩니다.
      # 감사 대상은 이미지(Dockerfile)·위 설치와 같은 constraints.txt의 고정판입니다. `-r requirements.txt`는
      # 임시 환경에서 constraints 없이 다시 해석해 그날의 최신 간접 의존성을 검사했습니다 — 고정판에 공시가 나고
      # 상위 판에서 고쳐지면 경고가 뜨지 않았습니다(QA-108). --no-deps·--disable-pip: 다시 해석·설치하지 않음.
      - name: 취약점 점검 (pip-audit)
        working-directory: collector
        continue-on-error: true
        run: pip install pip-audit==2.10.1 && pip-audit --disable-pip --no-deps -r constraints.txt

      - name: 스키마 적용 (번호 순서)
        env:
          PGPASSWORD: macro
        run: |
          for f in $(ls db/migrations/V*__*.sql | sort -t V -k 2 -n); do
            psql -h localhost -U macro -d macrodash_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: 테스트
        working-directory: collector
        env:
          # 저장 계층 테스트는 실제 PostgreSQL을 씁니다.
          TEST_DATABASE_URL: postgresql://macro:macro@localhost:5432/macrodash_test
        run: python -m pytest tests -q

  backend:
    name: 백엔드 (Java)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
          POSTGRES_DB: macrodash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macrodash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 스키마 적용 (번호 순서)
        env:
          PGPASSWORD: macro
        run: |
          for f in $(ls db/migrations/V*__*.sql | sort -t V -k 2 -n); do
            psql -h localhost -U macro -d macrodash_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: 빌드 및 테스트
        working-directory: backend
        env:
          # 통합 테스트가 실제 DB를 씁니다. 수집기는 없어도 되며,
          # 없을 때도 화면이 뜨는지까지 테스트가 확인합니다.
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/macrodash_test
          DATABASE_USER: macro
          DATABASE_PASSWORD: macro
        run: mvn -B verify

  frontend:
    name: 프런트엔드 (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 시장 달력·표기·실행 대기 등 화면 로직 자가 검증 (src/lib/__checks__)
      - name: 자가 검증
        working-directory: frontend
        run: npm run check

      # 훅을 실제로 렌더링해 보는 테스트 (vitest + Testing Library, src/**/__tests__)
      - name: 훅 테스트
        working-directory: frontend
        run: npm test

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 취약점 점검 (npm audit)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: 빌드 (타입 검사 포함)
        working-directory: frontend
        run: npm run build

  datasets-parity:
    name: 데이터셋 이름 대조
    runs-on: ubuntu-latest
    # 수집기(Python)와 백엔드(Java)가 같은 데이터셋 문자열을 쓰는지 확인합니다.
    # 어긋나면 "수집은 되는데 화면에는 안 보이는" 버그가 생깁니다.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 대조 테스트
        working-directory: backend
        run: mvn -B -Dtest=DatasetsParityTest -DfailIfNoTests=false test

  images:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    # make up이 쓰는 세 이미지(수집기·백엔드·프런트)가 지금 코드로 빌드되는지 확인합니다.
    # 위 잡들은 이미지 없이 소스로 돌아서, Dockerfile이나 운영 이미지 의존성만 깨진 경우
    # (예: 프레임워크를 올린 뒤 이미지 안의 빌드 단계 실패)를 잡지 못합니다.
    steps:
      - uses: actions/checkout@v7

      - name: AWS 덧붙임 해석 (compose.aws.yml)
        # 배포에서만 쓰는 덧붙임이 기반 compose와 합쳐 해석되는지(문법·!reset/!override 태그·필수 값)와, ADR 0012가 닫아 둔
        # 설정(포트는 루프백에만, store_only, 메일 끔, Secure 쿠키 기본값)이 풀리지 않았는지 봅니다. 로컬 실행에는 쓰지 않는
        # 파일이라 다른 잡이 읽지 않습니다. 값은 모두 가짜(비밀값 없음)이고, --env-file /dev/null로 다른 값은 읽지 않습니다.
        # 아래 세 줄은 서버 .env에 로컬 값이 섞여 들어온 경우를 흉내 냅니다 — 덧붙임이 이 값을 덮어써야 통과합니다.
        # COOKIE_SECURE는 .env로 바꿀 수 있게 둔 값이라 넣지 않고 기본값(true)만 봅니다.
        env:
          RDS_HOST: ci.example.ap-northeast-2.rds.amazonaws.com
          PUBLIC_ORIGIN: https://ci.example.cloudfront.net
          DATABASE_USER: ci
          DATABASE_PASSWORD: ci
          WEB_BIND_HOST: 0.0.0.0
          DASHBOARD_READ_MODE: auto
          MAIL_HOST: smtp.ci.example
        run: |
          docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config -q
          docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config --format json > "$RUNNER_TEMP/aws.json"
          jq -e '[.services[].ports[]?] | length > 0 and all(.host_ip == "127.0.0.1")' "$RUNNER_TEMP/aws.json"
          jq -e '.services.backend.environment | .COOKIE_SECURE == "true" and .DASHBOARD_READ_MODE == "store_only" and .MAIL_HOST == ""' "$RUNNER_TEMP/aws.json"

      - name: 이미지 빌드 (docker compose build)
        run: docker compose build

  secrets:
    name: 비밀값 검사 (gitleaks)
    runs-on: ubuntu-latest
    # 저장소가 Public이라 키가 한 번이라도 커밋되면 지워도 이력에 남습니다. 그래서 전체 이력을 봅니다.
    # gitleaks-action은 첫 push에서 '첫 커밋^' 범위를 만들다 git 오류로 실패하므로 공식 이미지를 직접 씁니다
    # (roadrail·wakeline과 같은 방식·같은 판). 진짜 비밀이 아닌 발견은 .gitleaksignore에 지문으로 하나씩 둡니다.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 전체 이력 검사
        # 태그는 바뀔 수 있어 이미지 digest(다중 아키텍처 목록)로 고정합니다. 저장소 전체를 마운트하는 이미지입니다.
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
