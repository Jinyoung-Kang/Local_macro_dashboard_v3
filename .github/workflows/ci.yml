name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: 수집기 (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
          POSTGRES_DB: macrodash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macrodash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            collector/requirements-dev.txt

      - name: 의존성 설치
        working-directory: collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 로컬에서 쓰는 린터(ruff, requirements-dev.txt에 버전 고정)를 CI에서도 돌립니다.
      - name: 린트 (ruff)
        working-directory: collector
        run: ruff check app tests

      - name: 스키마 적용 (번호 순서)
        env:
          PGPASSWORD: macro
        run: |
          for f in $(ls db/migrations/V*__*.sql | sort -t V -k 2 -n); do
            psql -h localhost -U macro -d macrodash_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: 테스트
        working-directory: collector
        env:
          # 저장 계층 테스트는 실제 PostgreSQL을 씁니다.
          TEST_DATABASE_URL: postgresql://macro:macro@localhost:5432/macrodash_test
        run: python -m pytest tests -q

  backend:
    name: 백엔드 (Java)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
          POSTGRES_DB: macrodash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macrodash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 스키마 적용 (번호 순서)
        env:
          PGPASSWORD: macro
        run: |
          for f in $(ls db/migrations/V*__*.sql | sort -t V -k 2 -n); do
            psql -h localhost -U macro -d macrodash_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: 빌드 및 테스트
        working-directory: backend
        env:
          # 통합 테스트가 실제 DB를 씁니다. 수집기는 없어도 되며,
          # 없을 때도 화면이 뜨는지까지 테스트가 확인합니다.
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/macrodash_test
          DATABASE_USER: macro
          DATABASE_PASSWORD: macro
        run: mvn -B verify

  frontend:
    name: 프런트엔드 (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 시장 달력·표기·실행 대기 등 화면 로직 자가 검증 (src/lib/__checks__)
      - name: 자가 검증
        working-directory: frontend
        run: npm run check

      # 훅을 실제로 렌더링해 보는 테스트 (vitest + Testing Library, src/**/__tests__)
      - name: 훅 테스트
        working-directory: frontend
        run: npm test

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 빌드 (타입 검사 포함)
        working-directory: frontend
        run: npm run build

  datasets-parity:
    name: 데이터셋 이름 대조
    runs-on: ubuntu-latest
    # 수집기(Python)와 백엔드(Java)가 같은 데이터셋 문자열을 쓰는지 확인합니다.
    # 어긋나면 "수집은 되는데 화면에는 안 보이는" 버그가 생깁니다.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 대조 테스트
        working-directory: backend
        run: mvn -B -Dtest=DatasetsParityTest -DfailIfNoTests=false test

  images:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    # make up이 쓰는 세 이미지(수집기·백엔드·프런트)가 지금 코드로 빌드되는지 확인합니다.
    # 위 잡들은 이미지 없이 소스로 돌아서, Dockerfile이나 운영 이미지 의존성만 깨진 경우
    # (예: 프레임워크를 올린 뒤 이미지 안의 빌드 단계 실패)를 잡지 못합니다.
    steps:
      - uses: actions/checkout@v7

      - name: 이미지 빌드 (docker compose build)
        run: docker compose build
