# =============================================================================
# compose.aws.yml — AWS 배포용 덧붙임 (ADR 0012). 로컬 실행에는 쓰지 않습니다.
#
#   docker compose -f docker-compose.yml -f compose.aws.yml --env-file .env build --pull   # 베이스 이미지 보안 패치
#   docker compose -f docker-compose.yml -f compose.aws.yml --env-file .env up -d
#
# 바뀌는 것
#   · postgres 컨테이너 대신 RDS(PostgreSQL 18, TLS) — 접속 주소는 RDS_HOST. 서버 인증서와 호스트 이름까지 검증(verify-full):
#     CA는 AWS 공개 신뢰 저장소의 서울 리전 묶음(certs/rds-ap-northeast-2-bundle.pem, truststore.pki.rds.amazonaws.com).
#     RDS_HOST는 RDS 기본 엔드포인트(*.rds.amazonaws.com)여야 함 — IP·별칭이면 호스트 이름 검증에 실패
#   · 화면·API는 127.0.0.1에만 열고, 앞단(Caddy)이 둘을 한 주소(같은 출처)로 묶음 → 프론트는 NEXT_PUBLIC_API_BASE=/
#   · 앞단이 넘긴 X-Forwarded-For를 Tomcat이 믿음(내부 대역에서 온 것만) → 로그인 제한이 방문자 IP별로 동작
#   · 공개 데모라 끄는 것: 메일(가입·재설정), 화면 조회가 수집을 일으키는 것(store_only),
#     무료 AI 엔진 키(NVIDIA·Cerebras·Cloudflare는 비움)
#   · 데모 열람(ADR 0013): 앞단 공개 쪽이 접근 코드를 확인한 요청에 X-Demo-Viewer 헤더로 DEMO_VIEWER_TOKEN을 실으면
#     로그인 없이 읽기 전용(GET만). 비우면 꺼짐(방문자도 로그인 화면). 운영자 쪽(관리자 터널)은 헤더를 지움
#   · AI 리포트(ADR 0014): 엔진은 Claude Haiku 5.5 하나만(AI_ENGINES), 키는 .env의 ANTHROPIC_API_KEY(비우면 AI 꺼짐).
#     데모 열람의 쓰기는 POST /api/ai/report 하나만 열리고, 방문자 전체가 하루 AI_DEMO_DAILY_LIMIT건(기본 20,
#     메모리 — 재시작하면 0부터)을 함께 씀. 앞단 Caddy 공개 쪽도 이 경로 하나만 POST를 통과시켜야 함
#   · DB 연결 수를 줄임(RDS db.t4g.micro 한 대를 세 프로젝트가 나눠 씀)
# 필요한 값(.env, 이름은 .env.aws.example): RDS_HOST · PUBLIC_ORIGIN · DATABASE_USER · DATABASE_PASSWORD ·
#   DEMO_VIEWER_TOKEN(32자 이상, 앞단 Caddy와 같은 값) · ANTHROPIC_API_KEY · AI_DEMO_DAILY_LIMIT(선택) 외 기존 값
# =============================================================================
services:
  postgres:
    profiles: ["local-db"]          # RDS를 쓰므로 띄우지 않음

  collector:
    depends_on: !reset {}
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:?}:${DATABASE_PASSWORD:?}@${RDS_HOST:?RDS_HOST 필요}:${RDS_PORT:-5432}/${DATABASE_NAME:-macrodash}?sslmode=verify-full&sslrootcert=/etc/rds-ca.pem
    volumes:
      - ./certs/rds-ap-northeast-2-bundle.pem:/etc/rds-ca.pem:ro

  backend:
    depends_on: !reset {}
    environment:
      DATABASE_URL: jdbc:postgresql://${RDS_HOST:?RDS_HOST 필요}:${RDS_PORT:-5432}/${DATABASE_NAME:-macrodash}?sslmode=verify-full&sslrootcert=/etc/rds-ca.pem
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "4"
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN 필요 (예 https://dxxxx.cloudfront.net)}
      PUBLIC_URL: ${PUBLIC_ORIGIN}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      DASHBOARD_READ_MODE: store_only
      # 국면 판정 기록 시각(KST, 기본 18). 이 배포는 평일 08:50–18:00만 켜져 18시 뒤 실행이 오지 않아 기록이 한 건도
      # 쌓이지 않았음(QA-093). 운영 창 안에서 수집이 가장 오래 돈 뒤인 17시 — 30분 주기라 17:2x·17:5x 실행이 걸림.
      DASHBOARD_SCHEDULER_REGIMERECORDHOURKST: "17"
      # 앞단(Caddy)이 X-Forwarded-For를 클라이언트 IP 하나로 덮어써 보냄. Tomcat RemoteIpValve는
      # 내부 대역(기본값: 10/8 · 172.16/12 · 192.168/16 · 127/8)에서 온 요청의 헤더만 믿는다.
      SERVER_FORWARDHEADERSSTRATEGY: native
      # 데모 열람 토큰 — 비면 꺼짐, 32자보다 짧으면 백엔드가 기동하지 않음(약한 토큰으로 켜지 않게).
      DASHBOARD_DEMO_VIEWER_TOKEN: ${DEMO_VIEWER_TOKEN:-}
      MAIL_HOST: ""
      # AI 리포트(ADR 0014) — 운영자의 Anthropic 계정으로 Haiku 하나만. 다른 엔진은 키를 비우고 허용 목록에서도 뺌.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ENGINES: anthropic_haiku
      AI_DEMO_DAILY_LIMIT: ${AI_DEMO_DAILY_LIMIT:-20}
      # 앞단 CloudFront 원본 응답 한도(120초)보다 먼저 포기해야 방문자가 오류 페이지 대신 실패 안내를 받고 사용량이 되돌아간다(ADR 0014)
      AI_TIMEOUT_SECONDS: "110"
      NVIDIA_API_KEY: ""
      CEREBRAS_API_KEY: ""
      CLOUDFLARE_API_TOKEN: ""
    volumes:
      - ./certs/rds-ap-northeast-2-bundle.pem:/etc/rds-ca.pem:ro
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE: "/"
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
